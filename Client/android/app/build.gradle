plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ── release 签名 ────────────────────────────────────────────────────────────
// 证书与口令放在 android/key.properties（**已被 .gitignore 忽略**，不进仓库）。
//
// 【为什么一定要留 fallback】仓库里**没有**这个文件。任何人 clone 下来都应该
// 能直接构建，所以文件不存在时退回 Flutter 模板的 debug 密钥 —— 能装能跑，
// 只是"作者证书签出来的正式包"只在作者本机产出。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "com.ns_zzj.dsh_webview_remote_client"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // 包名与鸿蒙的 bundleName 保持一致（都是 com.ns_zzj.dsh_webview_remote_client），
        // 免得两个平台认成两个应用。
        applicationId = "com.ns_zzj.dsh_webview_remote_client"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // minSdk：**故意不写 flutter.minSdkVersion（那是 21）**。
        //
        // 21 = Android 5.0，对本 App 是句空话：真正的门槛是 WebView 内核 114，
        // 而各 Android 版本能拿到的最高 WebView 是有限的（已查证）：
        //   · Android 6.0 (API 23) 封顶 Chrome/WebView 106 → 够不到 114
        //   · Android 7.0 (API 24) 封顶 119 → 114 在范围内 ✓
        // 所以 24 才反映真实门槛。写 21 只会让 Android 5/6 的用户装上一个
        // 注定打不开的 App，而且那个版本检查只在 console 里提示，用户看不到。
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // ── 签名配置 ─────────────────────────────────────────────
    // ⚠️ storeType 必须显式写 PKCS12：作者的证书是 .p12，不写这行 Gradle 会按
    //    默认的 JKS 去解，直接报 keystore 格式错。
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeType keystoreProperties["storeType"] ?: "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            // 有 key.properties → 用作者证书；没有 → 退回 debug 密钥（见文件顶部说明）。
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
